<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Reset password - Resume Prune</title>
<meta name="description" content="Reset your Resume Prune password. We'll email you a link to set a new one.">
<link rel="stylesheet" href="/shared/styles.css">
<script src="/shared/theme.js"></script>
</head>
<body>
<main style="max-width:480px">
  <a class="auth-brand" href="/" aria-label="Resume Prune home"><img src="/favicon.svg?v=2" alt="" width="40" height="40">Resume <em>Prune</em></a>
  <div class="card">
    <h1 id="heading" style="margin-bottom:1.25rem">Reset password</h1>
    <form id="request-form">
      <div style="margin-bottom:1rem"><label for="req-email">Email</label><input type="email" id="req-email" name="email" autocomplete="username" required></div>
      <button type="submit" class="btn-primary" style="width:100%">Send reset link</button>
      <p class="error" id="req-error" style="display:none"></p>
      <p class="muted" id="req-success" style="display:none;color:var(--sage);margin-top:1rem"></p>
    </form>
    <form id="confirm-form" style="display:none">
      <div style="margin-bottom:1.25rem"><label for="new-pw">New password (10+ chars)</label><input type="password" id="new-pw" name="new-password" autocomplete="new-password" required minlength="10"></div>
      <button type="submit" class="btn-primary" style="width:100%">Set new password</button>
      <p class="error" id="confirm-error" style="display:none"></p>
      <p class="muted" id="confirm-success" style="display:none;color:var(--sage);margin-top:1rem"></p>
    </form>
  </div>
</main>
<script src="/shared/auth-client.js"></script>
<script src="/shared/footer.js"></script>
<script src="/shared/pw-eyes.js"></script>
<script src="/shared/feedback-widget.js?v=3"></script>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');

if (token) {
  // The token is read once; it leaves the address bar so history, a shared
  // screenshot, or a Back press never carries a live reset credential.
  try { history.replaceState({}, '', '/reset-password'); } catch (e) {}
  document.getElementById('request-form').style.display = 'none';
  document.getElementById('confirm-form').style.display = 'block';
  document.getElementById('confirm-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('confirm-error');
    const ok  = document.getElementById('confirm-success');
    err.style.display = 'none'; ok.style.display = 'none';
    const r = await AuthClient.resetConfirm(token, document.getElementById('new-pw').value);
    if (r.ok) {
      ok.textContent = 'Password updated. You can log in now.';
      ok.style.display = 'block';
      // replace, not href: Back must not land on a used reset form.
      setTimeout(() => location.replace('/login'), 1500);
    } else {
      err.textContent = r.error || 'Reset failed.';
      err.style.display = 'block';
    }
  });
} else {
  document.getElementById('request-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('req-error');
    const ok  = document.getElementById('req-success');
    err.style.display = 'none'; ok.style.display = 'none';
    const r = await AuthClient.resetRequest(document.getElementById('req-email').value.trim().toLowerCase());
    // A 429 (too many requests, or today's email limit) carries error, not message.
    if (!r.ok) { err.textContent = r.error || "That didn't go through. Try again in a minute."; err.style.display = 'block'; return; }
    ok.textContent = r.message;
    ok.style.display = 'block';
  });
}
</script>
</body></html>
