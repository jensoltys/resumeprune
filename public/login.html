<body>
<main style="max-width:480px">
  <a class="auth-brand" href="/" aria-label="Resume Prune home"><img src="/favicon.svg?v=2" alt="" width="40" height="40">Resume <em>Prune</em></a>
  <div class="auth-twig" data-twig-scope><p class="twig-bubble" data-twig-bubble>Welcome back. I kept your spot trimmed.</p><div class="twig" data-twig="7" data-twig-poke></div></div>
  <h1 style="text-align:center;margin-bottom:2rem">Log in</h1>
  <div class="card">
    <form id="form">
      <div style="margin-bottom:1rem"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="username" required></div>
      <div style="margin-bottom:1.25rem"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
      <button type="submit" class="btn-primary" style="width:100%">Log in</button>
      <p class="error" id="error" style="display:none"></p>
    </form>
    <p style="text-align:center;margin-top:1rem"><a href="/reset-password" style="color:var(--plum)">Forgot password?</a></p>
    <p style="text-align:center;margin-top:0.5rem"><a href="/signup" style="color:var(--plum)">Need an account?</a></p>
  </div>
</main>
<script src="/shared/auth-client.js"></script>
<script src="/shared/twig.js"></script>
<script src="/shared/footer.js"></script>
<script src="/shared/pw-eyes.js"></script>
<script src="/shared/feedback-widget.js?v=3"></script>
<script>
// After successful login, decide where to go.
// ?next= must stay on this site. A bare startsWith('/') check lets
// //evil.site and /\evil.site through (browsers read both as another host),
// so resolve it against our origin and only keep it if the origin held.
function safeNext(next) {
  if (!next) return null;
  try {
    const u = new URL(next, location.origin);
    if (u.origin !== location.origin) return null;
    // '/.//evil.site' normalises to pathname '//evil.site'. Refuse it, and hand
    // back the full validated URL, never a string rebuilt from its parts.
    if (/^\/[\/\\]/.test(u.pathname)) return null;
    return u.href;
  } catch { return null; }
}

async function postLoginRedirect() {
  // If the user came from "Start Pro" / "Start Sprint" on the homepage but
  // already had an account, the plan intent is still in localStorage. Honor
  // it by routing straight to Stripe Checkout.
  const pendingPlan = localStorage.getItem('rp_pending_plan');
  if (pendingPlan === 'pro' || pendingPlan === 'sprint') {
    try {
      const resp = await fetch('/api/stripe/create-checkout', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ plan: pendingPlan, ref: (function(){try{var k='rp_aff_ref',t=+localStorage.getItem(k+'_at')||0,v=localStorage.getItem(k);if(!v)return null;if(!t){localStorage.setItem(k+'_at',String(Date.now()));return v}if(Date.now()-t>5184e6){localStorage.removeItem(k);localStorage.removeItem(k+'_at');return null}return v}catch(e){return null}})() || '' }),
      });
      const data = await resp.json();
      if (resp.ok && data.url) {
        localStorage.removeItem('rp_pending_plan');
        location.href = data.url;
        return;
      }
      // Fall through to normal redirect if checkout creation fails.
    } catch { /* fall through */ }
  }
  try {
    const r = await fetch('/api/profile', { credentials: 'include' });
    if (!r.ok) { location.replace('/'); return; }
    const data = await r.json();
    const dest = safeNext(new URL(location.href).searchParams.get('next'));
    if (dest) { location.replace(dest); return; }
    location.replace(data.has_resume ? '/app.html' : '/onboarding.html');
  } catch {
    location.replace('/');
  }
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('error');
  err.style.display = 'none';
  const r = await AuthClient.login({
    email: document.getElementById('email').value.trim().toLowerCase(),
    password: document.getElementById('password').value,
  });
  if (r.ok) {
    await postLoginRedirect();
  } else if (r.code === 'email_not_verified') {
    // Password was right, email never verified: hand them the code box.
    const email = r.email || document.getElementById('email').value.trim().toLowerCase();
    err.textContent = (r.error || 'Please verify your email before logging in.') + ' ';
    const a = document.createElement('a');
    a.href = '/signup?verify=' + encodeURIComponent(email);
    a.textContent = 'Enter your code';
    err.appendChild(a);
    err.style.display = 'block';
  } else {
    err.textContent = r.error || 'Log in failed.';
    err.style.display = 'block';
  }
});

// If the user is already logged in, skip the form and run the post-login
// redirect immediately (which respects ?next= and pending plan intent).
(async () => {
  try {
    const r = await fetch('/api/profile', { credentials: 'include' });
    if (r.ok) await postLoginRedirect();
  } catch { /* not logged in or offline, show the form */ }
})();
</script>
</body></html>
